[workspace]
resolver = "3"
members = ["crates/*", "examples", "tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
# Layering: fk-scene, fk-render and fk-physics depend on fk-geometry only, never on a
# concrete geometry crate. Concrete geometries are leaves chosen by the application.
fk-math = { path = "crates/fk-math" }
fk-geometry = { path = "crates/fk-geometry" }
fk-geometry-euclidean = { path = "crates/fk-geometry-euclidean" }
fk-geometry-hyperbolic = { path = "crates/fk-geometry-hyperbolic" }
fk-geometry-spherical = { path = "crates/fk-geometry-spherical" }
fk-quotient = { path = "crates/fk-quotient" }
fk-scene = { path = "crates/fk-scene" }
fk-shaders = { path = "crates/fk-shaders" }
fk-render = { path = "crates/fk-render" }
fk-physics = { path = "crates/fk-physics" }
fk-assets = { path = "crates/fk-assets" }
fk-app = { path = "crates/fk-app" }
fk-audio = { path = "crates/fk-audio" }

nalgebra = "0.35"
proptest = "1.11"

# S1: window, loop and key mapper.
winit = { version = "0.30.13", features = ["serde"] }
bevy_ecs = "0.19.1"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
directories = "6.0.0"
tracing = "0.1.44"
# The splash: an image in a window of its own while the app starts, put there by the CPU.
softbuffer = "0.4.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# S2: first pixel. naga and naga_oil move in lockstep with wgpu (naga_oil 0.23 is on naga 30).
wgpu = { version = "30.0.1", features = ["naga-ir"] }
naga = "30.0.1"
naga_oil = { version = "0.23.0", default-features = false }
encase = "0.13.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"

# S4 look development: screenshots of what the window shows.
png = "0.18.1"

# S4.5: sound.; on Linux the output needs ALSA (libasound2-dev).
kira = { version = "0.12.5", default-features = false, features = ["cpal", "mp3", "flac"] }
# kira's positions and orientations, for sounds placed about the ear.
mint = "0.5.9"

# Debug builds: the command list over the image, in a public-domain 8×8 bitmap font.
font8x8 = { version = "0.3.1", default-features = false }

# E1: meshes authored in glTF (positions, normals and uv only, from binary glTF).
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
