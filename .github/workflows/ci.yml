name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # kira's output (cpal) links ALSA on Linux and gilrs (the gamepads) udev; lavapipe
      # (mesa-vulkan-drivers) is the GPU the headless render tests draw with.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  # Releasing a crate is bumping its version. On main, once the checks pass, every crate whose
  # version is not on crates.io yet is published, dependencies first; the others are skipped.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `cargo publish` builds each crate from its package, fk-audio and fk-app included.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: python3 .github/scripts/publish-unreleased.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATESIO_TOKEN }}
