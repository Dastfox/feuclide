# The day and the night. Hours in [0, 24), angles in degrees, colours sRGB 0xRRGGBB.
# Azimuth 0 is along −z, 90 is to its right.

[clock]
# The hour the app starts at, and whether time starts stopped.
start_hour = 10.0
start_paused = false
# Real seconds for 24 hours at speed 1, while it runs.
day_seconds = 1440.0
# Each faster / slower order multiplies / divides the speed by this, up to max_speed (and
# down to 1 / max_speed).
speed_step = 2.0
max_speed = 4096.0
# Hours per second while scrubbing.
scrub_hours_per_second = 2.0
# Hours to jump to: dawn, midday, sunset, midnight.
presets = [5.6, 13.0, 20.3, 1.0]
# Speeds for testing only (`ClockInput::test_speed`):
# normal, a day in 48 s, a day in 6 s.
test_speeds = [1.0, 30.0, 240.0]

# A body is up from `rise` to `set` (across midnight if set < rise), climbing to
# `peak_elevation` halfway and turning half a circle from `rise_azimuth`; while down it sinks
# to `depth` below the horizon. It is drawn as `shape`: "disc", "ring" (a circle line) or
# "figure", the app's (`fk_render::SkyFigure`), given `figure = [a, b, c, d]`;
# lines are [sky] `stroke` wide. `radius` is the angular radius; `glow_size` the angle its
# glow fades over; `disc_brightness` multiplies the key's disc colour (above 1 glares).
# A long warm day and a short blue night.
[sun]
shape = "disc"
rise = 5.5
set = 20.5
peak_elevation = 58.0
depth = 30.0
rise_azimuth = -70.0
radius = 1.3
glow_size = 14.0
disc_brightness = 1.6

# The moon rises where the sun sets and sets where it rises: at dusk and at dawn the two are
# low together, a few degrees apart, the one time they can be seen at once (`[combo]` of
# world.toml).
[moon]
shape = "ring"
rise = 20.0
set = 6.0
peak_elevation = 34.0
depth = 30.0
rise_azimuth = 110.0
radius = 1.6
glow_size = 7.0
disc_brightness = 1.0

[stars]
# Cells of the star grid per radian; about one in seven holds a star.
density = 140.0
# The axis the sky turns about, and how many turns it makes in a day.
pole = [0.0, 0.75, -0.66]
turns_per_day = 1.0

[sky]
# Below 1 the zenith colour comes down low; above 1 the horizon colour climbs.
gradient = 0.55
# Width of the lines of the sun's star and the moon's ring, in degrees.
stroke = 0.22

# The colours of the hours, mixed between neighbouring keys round the clock.
#   light      the directional light: sun by day, moon by night
#   shadow     what faces away from it
#   zenith, horizon, below   the sky's gradient (below: under the horizon where nothing is)
#   sun_disc, sun_glow, moon_disc, moon_glow   the discs and the glow added around them
#   stars      their brightness, 0 for none
#   fog_density   fog per metre
# Around sunrise, sunset and moonrise keep light close to shadow: the light then slides from
# one body to the other unseen.

[[key]] # midnight
hour = 0.0
light = 0x6b7ba0
shadow = 0x1f2640
zenith = 0x0b1122
horizon = 0x1f2a46
below = 0x161d30
sun_disc = 0x000000
sun_glow = 0x000000
moon_disc = 0xe6ecf6
moon_glow = 0x1c2744
stars = 1.0
fog_density = 0.0007

