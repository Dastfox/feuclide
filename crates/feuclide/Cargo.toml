[package]
name = "feuclide"
description = "A game engine whose core does not assume Euclidean geometry"
# Not inherited from the workspace: this crate carries the README that crates.io
# renders, so it releases whenever the README does, independently of the fk-* crates.
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gamedev", "game-engine", "non-euclidean", "hyperbolic", "graphics"]
categories = ["game-engines", "graphics", "mathematics"]

[dependencies]
fk-math.workspace = true
fk-app.workspace = true
fk-geometry.workspace = true
fk-geometry-euclidean.workspace = true
fk-scene.workspace = true
fk-shaders.workspace = true
fk-render.workspace = true
fk-physics.workspace = true
fk-audio.workspace = true
fk-quotient.workspace = true

[lints]
workspace = true
